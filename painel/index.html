<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Painel · La Carne</title>
  <link rel="icon" href="../logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Poppins:wght@400;500;600;800&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://apis.google.com https://www.google.com/recaptcha/ https://www.gstatic.com/recaptcha/; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://firestore.googleapis.com https://firebaseinstallations.googleapis.com https://content-firebaseappcheck.googleapis.com https://identitytoolkit.googleapis.com https://securetoken.googleapis.com http://127.0.0.1:8080 http://127.0.0.1:9099; frame-src 'self' https://www.google.com/recaptcha/; base-uri 'none'; form-action 'none'; object-src 'none'">
  <link rel="stylesheet" href="../vendor/toastify.css">
  <link rel="stylesheet" href="../style.css">
  <link rel="stylesheet" href="painel.css">
  <script src="../vendor/toastify.js"></script>
  <script type="module" src="painel.js"></script>
</head>
<body>
  <header class="topbar">
    <img src="../logo.png" alt="">
    <h1>PAINEL</h1>
    <md-text-button id="sair" hidden>Sair</md-text-button>
  </header>
  <div id="offline" class="aviso" hidden>Sem conexão · as mudanças sincronizam quando a internet voltar</div>

  <section id="login" class="centro" hidden>
    <p id="loginMsg">Entre com a conta Google da loja.</p>
    <md-filled-button id="entrar"><md-icon slot="icon">login</md-icon>Entrar com Google</md-filled-button>
  </section>

  <main id="app" hidden>
    <section id="aba-pedidos">
      <md-filled-tonal-button id="som"><md-icon slot="icon">notifications_active</md-icon>Ativar som</md-filled-tonal-button>
      <div id="listaPedidos"></div>
    </section>
    <section id="aba-numeros" hidden>
      <div id="periodos" class="periodos">
        <md-filter-chip label="Hoje" data-p="hoje" selected></md-filter-chip>
        <md-filter-chip label="Semana" data-p="semana"></md-filter-chip>
        <md-filter-chip label="Mês" data-p="mes"></md-filter-chip>
      </div>
      <div id="numeros"></div>
      <md-outlined-button id="planilha"><md-icon slot="icon">download</md-icon>Baixar planilha</md-outlined-button>
    </section>
    <section id="aba-loja" hidden>
      <div id="controles"></div>
    </section>
  </main>

  <nav id="abas" class="abas" hidden>
    <button data-aba="pedidos" class="on"><md-icon>receipt_long</md-icon>Pedidos<span id="novos" hidden></span></button>
    <button data-aba="numeros"><md-icon>bar_chart</md-icon>Números</button>
    <button data-aba="loja"><md-icon>storefront</md-icon>Loja</button>
  </nav>

  <md-dialog id="pedidoDialog">
    <div slot="headline" class="headline"><span id="pedTitulo"></span>
      <md-icon-button data-fechar aria-label="Fechar"><md-icon>close</md-icon></md-icon-button></div>
    <div slot="content" id="pedCorpo"></div>
    <div slot="actions" class="acoes" id="pedAcoes"></div>
  </md-dialog>
</body>
</html>
